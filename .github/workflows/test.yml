              echo '```'
              cat target/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(summary.txt not produced — see logs.)_" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload HTML report
