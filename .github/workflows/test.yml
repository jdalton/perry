  zizmor__zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - uses: ./.github/actions/perry/actions/setup-node
        with:
          node-version-file: .node-version
      - name: Install pinned zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/soak/external-tools.mts --install zizmor
          node scripts/soak/external-tools.mts --print-bin >> "$GITHUB_PATH"
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pass the token only when non-empty: zizmor treats an empty
          # --gh-token as a real token, then fatally errors when its online
          # impostor-commit check can't authenticate.
          #
          # Starting gate: high only (config in .github/zizmor.yml). The 34
          # medium findings (missing permissions: blocks in test.yml /
          # benchmark.yml / container-tests.yml / cache-warm.yml /
          # simctl-tests.yml) are a tracked ratchet — audit each job's real
          # token needs, add the blocks, then gate at medium.
          if [ -n "${GH_TOKEN}" ]; then
            zizmor .github/ --gh-token "${GH_TOKEN}" --min-severity high
          else
            zizmor .github/ --min-severity high
          fi
    needs:
      - route
    if: ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['zizmor'] }}
    name: zizmor / zizmor
